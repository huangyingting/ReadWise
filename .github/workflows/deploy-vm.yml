name: Deploy VM

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  # The VM Compose project runs a `worker` service from `${APP_IMAGE}-worker`,
  # so the worker image must exist under the web image's tag before WebStack
  # deploys. Same commit, same tag: deploy and rollback move both together.
  build-worker:
    if: >-
      vars.VM_DEPLOY_ENABLED == 'true'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      - name: Determine worker image tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}:$(git rev-parse HEAD)-worker" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          build-args: PRISMA_SCHEMA_PATH=prisma/postgresql/schema.prisma
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build-worker
    if: >-
      vars.VM_DEPLOY_ENABLED == 'true'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    uses: huangyingting/webstack/.github/workflows/webstack-deploy.yml@v1.0.0
    with:
      mode: deploy-webapp
      app_name: ${{ vars.VM_APP_NAME || 'readwise' }}
      app_domain: readwise.genisisiq.com
      container_port: 3000
      host_port: 10005
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      operations_dockerfile: Dockerfile.ops
      operations_command: node scripts/validate-database-schema-config.mjs && node node_modules/prisma/build/index.js migrate deploy --schema prisma/postgresql/schema.prisma
      release_env_var: APP_VERSION
      database_url_query: schema=public&sslmode=require&uselibpqcompat=true&connection_limit=8&pool_timeout=10&connect_timeout=5
    secrets:
      APPLICATION_ENV: |
        ${{ secrets.VM_APP_ENV }}
        ${{ secrets.VM_AI_AUTH_ENV }}
        ${{ vars.ACCOUNT_MAIL_WORKFLOW_ENABLED != '' && format('ACCOUNT_MAIL_WORKFLOW_ENABLED={0}', vars.ACCOUNT_MAIL_WORKFLOW_ENABLED) || '' }}
        ${{ secrets.ACCOUNT_MAIL_WORKER_SECRET != '' && format('ACCOUNT_MAIL_WORKER_SECRET={0}', secrets.ACCOUNT_MAIL_WORKER_SECRET) || '' }}
        ${{ secrets.RETENTION_WORKER_SECRET != '' && format('RETENTION_WORKER_SECRET={0}', secrets.RETENTION_WORKER_SECRET) || '' }}
